<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台湾コレクション｜MAIBARU TRAVEL 非公式ファンサイト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#f3f1ea;
    --muted:rgba(243,241,234,.72);
    --faint:rgba(243,241,234,.45);
    --accent:#e9c25c;
    --line:rgba(243,241,234,.22);
  }
  *{box-sizing:border-box;}
  html{
    scrollbar-width:thin;
    scrollbar-color:rgba(243,241,234,.4) rgba(10,12,8,.6);
  }
  html::-webkit-scrollbar{width:8px;}
  html::-webkit-scrollbar-thumb{background:rgba(243,241,234,.4);border-radius:4px;}
  html::-webkit-scrollbar-track{background:rgba(10,12,8,.6);}
  html,body{
    margin:0;
    background:#0e100d;
    color:var(--ink);
    font-family:'Zen Kaku Gothic New','Hiragino Sans',sans-serif;
  }
  body{min-height:100vh;overflow-x:hidden;}
  .en{font-family:'Archivo',sans-serif;}
  a{color:inherit;}

  /* ---------- 背景（写真・動画・サムネイルが左へスライドして切り替わる） ---------- */
  .video-stage{position:fixed;inset:0;overflow:hidden;background:#0e100d;}
  .video-stage .bg-slot{
    position:absolute;inset:0;
    transform:translateX(100%);
    transition:transform .9s cubic-bezier(.65,0,.35,1);
    will-change:transform;
  }
  .video-stage .bg-slot img,
  .video-stage .bg-slot video{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;border:0;display:block;pointer-events:none;
  }
  .overlay{
    position:fixed;inset:0;pointer-events:none;
    background:
      linear-gradient(180deg, rgba(10,12,8,.35) 0%, rgba(10,12,8,.15) 35%, rgba(10,12,8,.55) 100%),
      linear-gradient(90deg, rgba(10,12,8,.15) 0%, rgba(10,12,8,0) 30%, rgba(10,12,8,.55) 100%);
  }
  /* 上部：スクロールしてきたものが固定の文字（戻る・Home等）の下でふわっと隠れるように */
  .top-fade{
    position:fixed;left:0;right:0;top:0;height:120px;z-index:2;
    pointer-events:none;
    background:linear-gradient(180deg, rgba(5,6,4,.62) 0%, rgba(5,6,4,0) 100%);
  }
  /* 左下の「この動画を見る」ボタン・下部情報の文字を読みやすくするための黒グラデーション */
  .bottom-fade{
    position:fixed;left:0;right:0;bottom:0;height:260px;z-index:2;
    pointer-events:none;
    background:linear-gradient(180deg, rgba(5,6,4,0) 0%, rgba(5,6,4,.55) 45%, rgba(5,6,4,.86) 100%);
  }

  /* ---------- 左上：海外ページへ戻る ---------- */
  .back-link{
    position:fixed;top:24px;left:30px;z-index:6;
    display:inline-flex;align-items:center;gap:14px;
    text-decoration:none;
  }
  .bl-arrow{font-size:1.6rem;line-height:1;transition:transform .2s ease,color .2s ease;}
  .bl-kicker{
    display:block;font-family:'Archivo',sans-serif;font-size:.68rem;
    letter-spacing:.18em;color:var(--faint);margin-bottom:4px;
  }
  .bl-main{display:block;font-size:1.25rem;font-weight:700;letter-spacing:.04em;transition:color .2s ease;}
  .back-link:hover .bl-arrow{transform:translateX(-5px);color:var(--accent);}
  .back-link:hover .bl-main{color:var(--accent);}

  /* ---------- 右上：Home / 国内 / 海外 ---------- */
  .top-nav{
    position:fixed;top:26px;right:34px;z-index:6;
    display:flex;gap:28px;
  }
  .top-nav a{
    display:inline-block;
    font-size:1.05rem;font-weight:700;letter-spacing:.06em;
    text-decoration:none;padding-bottom:3px;
    border-bottom:2px solid transparent;
    transition:color .2s ease,transform .15s ease,border-color .2s ease;
  }
  .top-nav a:hover{color:var(--accent);}
  .top-nav a:active{transform:scale(.94);}
  .top-nav a.current{border-bottom-color:var(--accent);}

  /* ---------- キャッチコピー ---------- */
  .tagline{
    position:fixed;top:92px;right:34px;z-index:4;
    text-align:right;
    font-weight:700;
    font-size:clamp(1.6rem,3.6vw,2.6rem);
    line-height:1.5;
    letter-spacing:.06em;
    text-shadow:0 2px 18px rgba(0,0,0,.4);
  }

  /* ---------- スクロールで流れるエリア（地図画像・地域紹介 → 動画） ---------- */
  .page{
    position:relative;z-index:1;
    padding:0 250px 0 40px;   /* 右側の固定ナビ・キャッチコピーと重ならないよう右を空ける */
  }
  .hero{
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:56px;
  }
  .region-detail{
    position:relative;isolation:isolate;
    display:flex;align-items:center;justify-content:center;gap:44px;
    width:100%;max-width:760px;padding:30px 36px;
  }
  /* 明るい動画の上でも読めるよう、背面をぼかした暗がりでうすく覆う（縁はぼやけて背景に溶ける） */
  .region-detail::before{
    content:"";position:absolute;inset:-6px -14px;z-index:-1;pointer-events:none;
    background:rgba(5,6,4,.5);
    filter:blur(26px);
    border-radius:24px;
  }
  .scroll-hint{
    display:flex;flex-direction:column;align-items:center;gap:10px;
    font-family:'Archivo',sans-serif;font-size:.68rem;letter-spacing:.32em;color:var(--faint);
  }
  .sh-line{
    display:block;width:1px;height:46px;transform-origin:top;
    background:linear-gradient(180deg,var(--faint),transparent);
    animation:shPulse 2.2s ease-in-out infinite;
  }
  @keyframes shPulse{
    0%{transform:scaleY(0);opacity:0;}
    30%{opacity:1;}
    60%{transform:scaleY(1);}
    100%{transform:scaleY(1);opacity:0;}
  }
  .region-detail-media{
    position:relative;flex:none;width:200px;height:200px;
    display:flex;align-items:center;justify-content:center;
  }
  .region-detail-media img{
    max-width:100%;max-height:100%;display:block;
    filter:drop-shadow(0 10px 26px rgba(0,0,0,.55));
    opacity:0;                       /* 読み込みが終わるまでは見せない（壊れた画像アイコンや前の画像が出ないように） */
    transition:opacity .45s ease;
  }
  .region-detail-media.loaded img{opacity:1;}
  .region-map-placeholder{
    position:absolute;inset:0;
    display:none;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;font-size:.78rem;line-height:1.7;color:var(--faint);
    border:1.5px dashed var(--line);border-radius:6px;
    padding:10px;
  }
  /* 画像が見つからなかった時だけ、かつ SHOW_MAP_PLACEHOLDER が true の時だけ仮の枠を出す */
  .region-detail-media.no-image.show-placeholder .region-map-placeholder{display:flex;}
  /* 画像が無く、仮の枠も出さない設定の時は、枠ごと消して文章を中央に寄せる */
  .region-detail-media.no-image:not(.show-placeholder){display:none;}
  .rd-kicker{
    font-size:.7rem;letter-spacing:.2em;color:var(--muted);margin:0 0 10px;
    text-shadow:0 1px 6px rgba(0,0,0,.7);
  }
  .region-detail-text h2{
    font-size:2.1rem;font-weight:700;margin:0 0 16px;letter-spacing:.04em;
    text-shadow:0 2px 18px rgba(0,0,0,.6);
  }
  .region-detail-text p:not(.rd-kicker){
    font-size:1.02rem;line-height:2;font-weight:500;
    color:#fbfaf6;margin:0;                      /* 以前より濃い（ほぼ真っ白）色 */
    text-shadow:0 1px 2px rgba(0,0,0,.8), 0 2px 16px rgba(0,0,0,.75);
  }

  /* ---------- 動画の紹介（スクロールすると下から順番に現れる） ---------- */
  .videos{padding:6vh 0 38vh;}
  .video-cards{display:flex;flex-direction:column;align-items:center;gap:15vh;}
  .video-card{
    display:block;width:min(640px,100%);
    background:none;border:0;padding:0;margin:0;
    color:inherit;font:inherit;text-align:left;cursor:pointer;text-decoration:none;
    opacity:0;transform:translateY(70px);
    transition:opacity .8s ease, transform .8s cubic-bezier(.2,.7,.2,1);
    transition-delay:var(--d,0ms);
  }
  .video-card.in-view{opacity:1;transform:none;}
  .video-card.disabled{cursor:default;}
  .video-card.disabled.in-view{opacity:.6;}
  .video-card:focus-visible{outline:2px solid var(--accent);outline-offset:6px;}
  .vc-thumb{
    position:relative;aspect-ratio:16/9;overflow:hidden;
    background:rgba(243,241,234,.1);border-radius:3px;
    border:2px solid transparent;
    display:flex;align-items:center;justify-content:center;color:var(--faint);
    box-shadow:0 18px 50px rgba(0,0,0,.45);
    transition:border-color .3s ease;
  }
  .vc-thumb img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
    transition:transform .5s ease;
  }
  .video-card:hover:not(.disabled) .vc-thumb img{transform:scale(1.04);}
  .video-card.playing .vc-thumb{border-color:var(--accent);}
  /* クリックできることが分かるよう、ホバーで再生ボタンを出す */
  .vc-play{
    position:absolute;left:50%;top:50%;z-index:2;
    width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:rgba(10,12,8,.6);border:1.8px solid rgba(243,241,234,.9);
    opacity:0;transform:scale(.85);
    transition:opacity .25s ease, transform .25s ease;
    pointer-events:none;
  }
  .vc-play::after{
    content:"";width:0;height:0;margin-left:5px;
    border-top:10px solid transparent;border-bottom:10px solid transparent;
    border-left:16px solid var(--ink);
  }
  .video-card:hover:not(.disabled) .vc-play,
  .video-card:focus-visible .vc-play{opacity:1;transform:none;}
  .vc-chips{
    position:absolute;left:12px;top:12px;z-index:2;
    display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 24px);
  }
  .vc-chip{
    padding:4px 12px;
    font-size:.82rem;font-weight:700;letter-spacing:.06em;line-height:1.5;
    color:var(--ink);
    background:rgba(10,12,8,.74);
    border:1px solid rgba(243,241,234,.38);
    border-radius:999px;
    backdrop-filter:blur(4px);
  }
  .vc-meta{
    margin-top:18px;
    opacity:0;transform:translateY(26px);
    transition:opacity .7s ease, transform .7s ease;
    transition-delay:calc(var(--d,0ms) + 300ms);   /* サムネイルのあとにタイトルが出る */
  }
  .video-card.in-view .vc-meta{opacity:1;transform:none;}
  .vc-tags{display:flex;gap:14px;align-items:baseline;margin-bottom:6px;}
  .vc-badge{font-family:'Archivo',sans-serif;font-size:.7rem;letter-spacing:.16em;color:var(--accent);}
  .vc-now{display:none;font-family:'Archivo',sans-serif;font-size:.66rem;letter-spacing:.18em;color:var(--muted);}
  .video-card.playing .vc-now{display:inline;}
  .vc-title{
    display:block;font-size:1.25rem;font-weight:700;line-height:1.6;
    text-shadow:0 2px 12px rgba(0,0,0,.55);
  }
  .ph-circle{
    display:inline-flex;align-items:center;justify-content:center;
    width:44px;height:44px;border-radius:50%;
    border:1.8px solid currentColor;box-sizing:border-box;flex:none;
  }
  .ph-triangle{
    width:0;height:0;
    border-top:8px solid transparent;border-bottom:8px solid transparent;
    border-left:12px solid currentColor;margin-left:4px;flex:none;
  }
  @media (prefers-reduced-motion: reduce){
    .video-card,.vc-meta{opacity:1;transform:none;transition:none;}
    .sh-line{animation:none;}
  }

  /* ---------- 右側：地方ナビ ---------- */
  .region-nav{
    --rn-size:1.55rem;                 /* 地方名の文字サイズ（画面の高さが低い時は下で小さくする） */
    position:fixed;top:300px;right:34px;
    z-index:5;text-align:right;
    /* 全項目の「行の高さ」を、いちばん高い項目（地方名＋英語の2行）に自動で揃える。
       英語の無い「Top」も同じ高さの枠の中央に置かれるので、上に詰まらない */
    display:grid;grid-auto-rows:1fr;justify-items:end;gap:22px;
  }
  .region-nav button{
    background:none;border:none;color:var(--ink);cursor:pointer;
    padding:0;font-family:'Zen Kaku Gothic New',sans-serif;
    text-align:right;
    display:flex;flex-direction:column;justify-content:center;align-items:flex-end;
  }
  .region-nav .rn-jp{
    display:block;font-size:var(--rn-size);font-weight:700;letter-spacing:.08em;
    transition:color .2s ease, transform .2s ease;
  }
  /* アルファベットの「Top」は漢字より小さく見えるので、少し大きくして見た目の大きさを揃える */
  .region-nav button[data-region="all"] .rn-jp{
    font-size:calc(var(--rn-size) * 1.28);
    letter-spacing:.1em;
  }
  .region-nav .rn-en{
    display:block;font-family:'Archivo',sans-serif;font-size:.9rem;
    letter-spacing:.16em;color:var(--faint);margin-top:4px;
    transition:color .2s ease;
  }
  .region-nav button:hover .rn-jp,.region-nav button.active .rn-jp{color:var(--accent);transform:translateX(-4px);}
  .region-nav button.active .rn-en{color:var(--accent);}

  /* ---------- 左下：動画へのリンクボタン ---------- */
  .bottom-bar{position:fixed;left:30px;bottom:58px;z-index:5;}
  .watch-btn{
    display:inline-flex;align-items:center;gap:10px;
    background:rgba(243,241,234,.08);
    border:1px solid var(--line);
    backdrop-filter:blur(2px);
    padding:14px 22px;border-radius:2px;
    font-size:.92rem;font-weight:700;letter-spacing:.04em;
    text-decoration:none;
    transition:background .2s ease,border-color .2s ease;
  }
  .watch-btn:hover{background:rgba(243,241,234,.16);border-color:rgba(243,241,234,.4);}
  .watch-btn .wb-icon{font-size:.8rem;color:var(--accent);}

  /* ---------- 最下部：現在の動画タイトル ---------- */
  .info-line{
    position:fixed;left:30px;bottom:26px;z-index:6;
    font-size:1.05rem;font-weight:500;
    letter-spacing:.02em;color:var(--ink);
    max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    text-shadow:0 2px 10px rgba(0,0,0,.5);
  }

  /* ---------- 右下：ロゴ ---------- */
  .brand-corner{
    position:fixed;right:30px;bottom:26px;z-index:5;text-align:right;
    text-decoration:none;
  }
  .brand-jp{display:block;font-family:'Archivo',sans-serif;font-weight:900;font-size:1rem;letter-spacing:.02em;}
  .brand-en{display:block;font-family:'Archivo',sans-serif;font-size:.62rem;letter-spacing:.14em;color:var(--faint);margin-top:2px;}

  /* 画面の高さが低いPC向け：右側の文字を少し詰めて重なりを防ぐ */
  @media (max-height:780px){
    .tagline{top:78px;font-size:clamp(1.3rem,2.7vw,2rem);}
    .region-nav{--rn-size:1.35rem;top:236px;gap:14px;}
    .region-nav .rn-en{font-size:.8rem;margin-top:2px;}
  }
  @media (max-width:1100px){
    .region-detail{flex-direction:column;gap:24px;text-align:center;}
    .region-detail-media{width:170px;height:170px;}
  }
  @media (max-width:760px){
    .tagline{display:none;}
    .page{padding:0 112px 0 20px;}
    .region-nav{gap:16px;right:20px;}
    .back-link{left:20px;}
    .top-nav{right:20px;gap:16px;}
    .bottom-bar{left:20px;bottom:76px;}
    .info-line{left:20px;max-width:55vw;}
    .brand-corner{right:20px;}
  }

  /* ---------- スマホ用（600px以下のみ。PC表示には影響しません） ---------- */
  @media (max-width:600px){
    /* 上部：戻るリンクとナビを小さくして1行に収める */
    .back-link{top:16px;left:16px;gap:8px;}
    .bl-arrow{font-size:1.2rem;}
    .bl-kicker{font-size:.58rem;margin-bottom:2px;}
    .bl-main{font-size:.95rem;}
    .top-nav{top:18px;right:16px;gap:14px;}
    .top-nav a{font-size:.88rem;padding:6px 0 3px;}
    .top-fade{height:150px;}

    /* 地方ナビ：右の縦並び → 上部の横並びタブに（動画の幅を広く使えるように） */
    .region-nav{
      top:62px;left:0;right:0;z-index:5;
      display:flex;justify-content:center;gap:6px;padding:0 12px;
    }
    .region-nav button{
      flex:0 1 auto;min-width:54px;padding:7px 12px;
      border:1px solid var(--line);border-radius:999px;
      background:rgba(10,12,8,.45);
      backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
      align-items:center;
    }
    .region-nav .rn-jp,
    .region-nav button[data-region="all"] .rn-jp{font-size:.88rem;letter-spacing:.04em;}
    .region-nav .rn-en{display:none;}
    .region-nav button:hover .rn-jp,.region-nav button.active .rn-jp{transform:none;}
    .region-nav button.active{border-color:var(--accent);background:rgba(233,194,92,.16);}

    /* 本文を画面いっぱいに */
    .page{padding:0 16px;}
    .hero{min-height:100vh;min-height:100svh;padding-top:110px;gap:36px;}
    .region-detail{padding:20px 6px;gap:18px;}
    .region-detail-media{width:140px;height:140px;}
    .region-detail-text h2{font-size:1.7rem;margin-bottom:12px;}
    .region-detail-text p:not(.rd-kicker){font-size:.95rem;line-height:1.9;}

    .videos{padding:4vh 0 34vh;}
    .video-cards{gap:9vh;}
    .vc-play{width:52px;height:52px;margin:-26px 0 0 -26px;opacity:.9;transform:none;} /* タッチ端末はホバーできないので常に表示 */
    .vc-chip{font-size:.74rem;padding:3px 10px;}
    .vc-meta{margin-top:12px;}
    .vc-title{font-size:1.05rem;line-height:1.55;}

    /* 下部 */
    .bottom-bar{left:16px;bottom:62px;}
    .watch-btn{padding:11px 16px;font-size:.84rem;}
    .info-line{left:16px;bottom:22px;max-width:calc(100vw - 150px);font-size:.85rem;}
    .brand-corner{right:16px;bottom:22px;}
    .brand-jp{font-size:.85rem;}
    .brand-en{display:none;}
    .bottom-fade{height:200px;}
  }
</style>
</head>
<body>

<div class="video-stage" id="videoStage"></div>
<div class="overlay"></div>
<div class="top-fade"></div>
<div class="bottom-fade"></div>

<a class="back-link" href="world.html">
  <span class="bl-arrow">←</span>
  <span>
    <span class="bl-kicker en">BACK TO</span>
    <span class="bl-main">海外に戻る</span>
  </span>
</a>

<nav class="top-nav">
  <a href="index.html">Home</a>
  <a href="japan.html">国内</a>
  <a href="world.html" class="current">海外</a>
</nav>

<div class="tagline">
  巡る、<br>台湾の<br>素顔。
</div>

<main class="page">
  <section class="hero">
    <div class="region-detail" id="regionDetail">
      <div class="region-detail-media">
        <img id="regionMapImg" alt="">
        <div class="region-map-placeholder" id="regionMapPlaceholder">
          地図画像<br><span class="en" id="regionMapFileName"></span><br>を用意してください
        </div>
      </div>
      <div class="region-detail-text">
        <p class="rd-kicker en">AREA</p>
        <h2 id="regionDetailName">台湾</h2>
        <p id="regionDetailDesc"></p>
      </div>
    </div>
    <div class="scroll-hint" aria-hidden="true">
      <span>SCROLL</span>
      <span class="sh-line"></span>
    </div>
  </section>

  <section class="videos" id="videoSection">
    <div class="video-cards" id="videoCards"></div>
  </section>
</main>

<nav class="region-nav" id="regionNav">
  <button type="button" data-region="all" class="active">
    <span class="rn-jp">Top</span>
  </button>
  <button type="button" data-region="north">
    <span class="rn-jp">北部</span><span class="rn-en en">North</span>
  </button>
  <button type="button" data-region="central">
    <span class="rn-jp">中部</span><span class="rn-en en">Central</span>
  </button>
  <button type="button" data-region="south">
    <span class="rn-jp">南部</span><span class="rn-en en">South</span>
  </button>
  <button type="button" data-region="east">
    <span class="rn-jp">東部</span><span class="rn-en en">East</span>
  </button>
</nav>

<div class="bottom-bar">
  <a class="watch-btn" id="watchBtn" href="https://www.youtube.com/c/maibaru" target="_blank" rel="noopener">
    <span class="wb-icon">▶</span> <span id="watchLabel">YouTubeでこの動画を見る</span>
  </a>
</div>

<div class="info-line" id="infoLine">TAIWAN COLLECTION ｜ 読み込み中…</div>

function extractYouTubeId(url){
  if(!url) return null;
  const patterns = [
    /(?:youtube\.com\/watch\?v=)([\w-]{11})/,
    /(?:youtu\.be\/)([\w-]{11})/,
    /(?:youtube\.com\/shorts\/)([\w-]{11})/,
    /(?:youtube\.com\/embed\/)([\w-]{11})/,
  ];
  for(const p of patterns){
    const m = url.match(p);
    if(m) return m[1];
  }
  return null;
}

/* ---------- 動画の一覧 ---------- */
// 4地方すべての動画（どの地方のものかを regionKey として付けて、ひとつの配列にまとめる）
function getAllEntries(){
  return REGION_ORDER.flatMap(key =>
    (TAIWAN_VIDEOS[key] || []).map(v => Object.assign({}, v, { regionKey:key }))
  );
}
// 紹介エリアに出す動画：
//   Top ……… home を付けたものだけを、数字の小さい順に並べる（home:1, home:2 …）。
//            数字なしの home:true は数字付きのあとに、元の順で並ぶ。どれにも付けなければ全部（元の順）
//   各地方 … その地方の動画（元の順）
function pickIntroEntries(all, region){
  if(region !== "all") return all.filter(e => e.regionKey === region);
  const chosen = all
    .map((entry, order) => ({ entry, order }))
    .filter(x => x.entry.home === true || typeof x.entry.home === "number");
  if(chosen.length === 0) return all;
  const rank = h => (typeof h === "number" ? h : Infinity);
  chosen.sort((a, b) => (rank(a.entry.home) - rank(b.entry.home)) || (a.order - b.order));
  return chosen.map(x => x.entry);
}

/* BG_SLIDES が空の地域で使う：bg:true の付いたものがあればそれだけ、無ければ再生できる全部 */
function pickBackgroundClips(entries){
  const playable = entries.filter(e => e.url);
  const chosen = playable.filter(e => e.bg);
  return chosen.length ? chosen : playable;
}

/* ---------- 背景に流すものを、扱いやすい形にそろえる ---------- */
// 1件を { kind:"image"|"video"|"youtube", ... } の形にする
function normalizeSlide(s){
  if(!s) return null;
  const ytId = extractYouTubeId(s.url) || extractYouTubeId(s.link);
  const entry = ytId ? getAllEntries().find(e => extractYouTubeId(e.url) === ytId) : null;
  const base = {
    title: s.title || (entry && entry.title) || "",
    link: s.link || s.url || (entry && entry.url) || "",
    seconds: Number(s.seconds) > 0 ? Number(s.seconds) : 0,
    ytId,
  };
  if(s.video) return Object.assign(base, { kind:"video", src:s.video, poster:s.poster || "" });
  if(s.image) return Object.assign(base, { kind:"image", src:s.image });
  if(ytId)    return Object.assign(base, { kind:"youtube", id:ytId });
  return null;
}
// 地域ごとの背景の並び：BG_SLIDES に書いてあればその順番、空なら bg:true のサムネイル
function buildSlides(region, pool){
  const custom = Array.isArray(BG_SLIDES[region]) ? BG_SLIDES[region] : [];
  const list = custom.length
    ? custom.map(normalizeSlide)
    : pickBackgroundClips(pool).map(e => normalizeSlide({ url:e.url }));
  return list.filter(Boolean);
}

function setYouTubeThumb(img, id){
  const names = ["maxresdefault", "hq720", "hqdefault"];
  let i = 0;
  const tryNext = () => {
    if(i >= names.length) return;
    img.src = `https://img.youtube.com/vi/${id}/${names[i++]}.jpg`;
  };
  img.onload = () => { if(img.naturalWidth <= 120 && i < names.length) tryNext(); };
  img.onerror = tryNext;
  tryNext();
}

function setupFrames(){
  stage.innerHTML = "";
  slots = [0, 1].map(() => {
    const d = document.createElement("div");
    d.className = "bg-slot";
    stage.appendChild(d);
    return d;
  });
}

// 枠を横位置(%)に置く。animate=true でスライド、false で一瞬で移動
function place(el, x, animate){
  el.style.transition = animate ? "" : "none";
  el.style.transform = `translateX(${x}%)`;
}

function slotVideo(slot){ return slot.querySelector("video"); }

// 枠の中身を、写真・動画・サムネイルのどれかに入れ替える
function fillSlot(slot, slide){
  const old = slotVideo(slot);
  if(old){ old.pause(); old.removeAttribute("src"); old.load(); }
  slot.innerHTML = "";
  if(!slide) return;
  if(slide.kind === "video"){
    const v = document.createElement("video");
    v.muted = true;
    v.defaultMuted = true;
    v.playsInline = true;
    v.setAttribute("playsinline", "");
    v.setAttribute("muted", "");
    v.preload = "auto";
    if(slide.poster) v.poster = slide.poster;
    v.src = slide.src;
    slot.appendChild(v);
  } else {
    const img = document.createElement("img");
    img.alt = "";
    img.decoding = "async";
    if(slide.kind === "youtube") setYouTubeThumb(img, slide.id);
    else img.src = slide.src;
    slot.appendChild(img);
  }
}

function resetFrames(){
  slots.forEach(s => { fillSlot(s, null); place(s, 100, false); });
}

function updateInfo(slide){
  if(!slide){
    infoLine.textContent = "TAIWAN COLLECTION ｜ この地域の動画は準備中です";
    watchBtn.style.visibility = "hidden";
    return;
  }
  infoLine.textContent = slide.title ? `TAIWAN COLLECTION ｜ ${slide.title}` : "TAIWAN COLLECTION";
  if(slide.link){
    watchBtn.href = slide.link;
    watchLabel.textContent = extractYouTubeId(slide.link) ? "YouTubeでこの動画を見る" : "詳しく見る";
    watchBtn.style.visibility = "visible";
  } else {
    watchBtn.style.visibility = "hidden";
  }
}

function startPlayback(){
  const token = ++playToken;
  clearTimeout(prepTimer);
  clearTimeout(switchTimer);
  resetFrames();
  if(currentSlides.length === 0){
    updateInfo(null);
    markPlaying(null);
    return;
  }
  idx = 0;
  visibleSide = 0;
  fillSlot(slots[0], currentSlides[0]);
  place(slots[0], 0, false);
  if(currentSlides.length > 1){
    fillSlot(slots[1], currentSlides[1]); // 次を右側で待機
  }
  showCurrent(token);
}

// いま見えている1枚を表示し、表示時間が過ぎたら次へ
function showCurrent(token){
  if(token !== playToken) return;
  const slide = currentSlides[idx % currentSlides.length];
  const v = slotVideo(slots[visibleSide]);
  updateInfo(slide);
  markPlaying(slide);

  if(v){
    v.loop = currentSlides.length < 2;   // 1件だけならくり返す
    try{ v.currentTime = 0; }catch(e){}
    const p = v.play();
    if(p && p.catch) p.catch(() => {});
  }
  if(currentSlides.length < 2) return;   // 1件だけならスライドしない

  clearTimeout(switchTimer);
  const next = () => {
    if(token !== playToken) return;
    clearTimeout(switchTimer);
    if(v){ v.onended = null; v.onerror = null; }
    advance(token);
  };
  if(v && !slide.seconds){
    // 動画：最後まで再生したら次へ（読み込めない時は標準の秒数で次へ）
    v.onended = next;
    v.onerror = () => { clearTimeout(switchTimer); switchTimer = setTimeout(next, BG_SECONDS * 1000); };
    switchTimer = setTimeout(next, (v.error ? BG_SECONDS : MAX_VIDEO_SECONDS) * 1000);
  } else {
    switchTimer = setTimeout(next, (slide.seconds || BG_SECONDS) * 1000);
  }
}

function advance(token){
  const out = slots[visibleSide];
  const inn = slots[1 - visibleSide];
  idx++;
  visibleSide = 1 - visibleSide;
  place(out, -100, true); // 今のものは左へ
  place(inn, 0, true);    // 次のものが右から入ってきて止まる
  showCurrent(token);

  // スライドが終わったら、出ていった枠を右側に戻して、さらに次のものを仕込む
  clearTimeout(prepTimer);
  prepTimer = setTimeout(() => {
    if(token !== playToken) return;
    place(out, 100, false);
    fillSlot(out, currentSlides[(idx + 1) % currentSlides.length]);
  }, SLIDE_MS + 100);
}

/* ---------- 動画の紹介カード（スクロールで下から順番に現れる） ---------- */
const cardEls = new Map();
let revealObserver = null;

function setupReveal(){
  if(revealObserver) revealObserver.disconnect();
  const cards = Array.from(videoCards.querySelectorAll(".video-card"));
  if(!("IntersectionObserver" in window)){
    cards.forEach(c => c.classList.add("in-view"));
    return;
  }
  revealObserver = new IntersectionObserver((entries) => {
    // 同時に見えた場合も、上から順番に少しずつ時間差で現れるようにする
    const visible = entries
      .filter(e => e.isIntersecting)
      .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
    visible.forEach((e, k) => {
      e.target.style.setProperty("--d", (k * 160) + "ms");
      e.target.classList.add("in-view");
      revealObserver.unobserve(e.target);
    });
  }, { threshold: 0.15, rootMargin: "0px 0px -12% 0px" });
  cards.forEach(c => revealObserver.observe(c));
}

function renderVideoCards(entries, region){
  videoCards.innerHTML = "";
  cardEls.clear();
  entries.forEach(entry => {
    const playable = !!entry.url;
    // URLがある動画は、クリックでそのページ（YouTube）を新しいタブで開くリンクにする
    const el = document.createElement(playable ? "a" : "div");
    if(playable){
      el.href = entry.url;
      el.target = "_blank";
      el.rel = "noopener";
    }
    el.className = "video-card" + (playable ? "" : " disabled");

    const thumb = document.createElement("div");
    thumb.className = "vc-thumb";
    const id = extractYouTubeId(entry.url);
    if(id){
      const img = document.createElement("img");
      img.src = `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
      img.alt = entry.title || "";
      thumb.appendChild(img);
    } else {
      thumb.innerHTML = '<span class="ph-circle"><span class="ph-triangle"></span></span>';
    }

    // ラベル（県・市や、食・自然などのジャンル）をサムネイルの左上に表示
    const labels = (Array.isArray(entry.tags) ? entry.tags : []).filter(Boolean);
    if(labels.length){
      const chips = document.createElement("div");
      chips.className = "vc-chips";
      labels.forEach(t => {
        const chip = document.createElement("span");
        chip.className = "vc-chip";
        chip.textContent = t;
        chips.appendChild(chip);
      });
      thumb.appendChild(chips);
    }

    const meta = document.createElement("div");
    meta.className = "vc-meta";
    const tags = document.createElement("div");
    tags.className = "vc-tags";
    if(region === "all"){
      const badge = document.createElement("span");
      badge.className = "vc-badge";
      badge.textContent = REGION_LABELS[entry.regionKey] || "";
      tags.appendChild(badge);
    }
    const now = document.createElement("span");
    now.className = "vc-now";
    now.textContent = "NOW PLAYING";
    tags.appendChild(now);
    const title = document.createElement("span");
    title.className = "vc-title";
    title.textContent = entry.title || "（タイトル未入力）";
    meta.appendChild(tags);
    meta.appendChild(title);

    el.appendChild(thumb);
    el.appendChild(meta);

    if(playable){
      const play = document.createElement("span");
      play.className = "vc-play";
      thumb.appendChild(play);
    }
    cardEls.set(entry, el);
    videoCards.appendChild(el);
  });
  setupReveal();
}

// 背景に出ているものと同じ動画のカードに「NOW PLAYING」を付ける（自分の写真・動画は link で判定）
function markPlaying(slide){
  const id = slide ? slide.ytId : null;
  cardEls.forEach((el, entry) => {
    el.classList.toggle("playing", !!id && extractYouTubeId(entry.url) === id);
  });
}

/* ---------- 地域の切り替え ---------- */
function selectRegion(region){
  currentRegion = region;
  regionNav.querySelectorAll("button").forEach(b => {
    b.classList.toggle("active", b.dataset.region === region);
  });
  const all = getAllEntries();
  currentEntries = pickIntroEntries(all, region);                       // 下に紹介する動画
  const bgPool = region === "all" ? all : currentEntries;               // BG_SLIDES が空の時の候補（Topは全地方から）
  currentSlides = buildSlides(region, bgPool);
  window.scrollTo({ top: 0, behavior: "auto" });
  renderVideoCards(currentEntries, region);
  updateRegionDetail(region);
  startPlayback();
}

function initRegionNav(){
  regionNav.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => selectRegion(btn.dataset.region));
  });
}

setupFrames();
initRegionNav();
selectRegion(DEFAULT_REGION);
</script>
