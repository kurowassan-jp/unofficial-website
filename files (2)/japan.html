      <p>四季折々の日本の魅力を公開中。春の桜、夏の青空、秋の紅葉、冬の雪景色。日本各地で出会った、その瞬間だけのきらめきを。あなたのお気に入りの風景や、次の旅の目的地がきっと見つかる。</p>

           （画像があるのに、イラストが一瞬見えてしまうのを防ぐ） */

          var f = document.currentScript.parentNode;
          if(typeof pageImages !== "undefined"){
            var c = pageImages[f.getAttribute("data-page")];
            if(c && c.image){ f.classList.add("has-photo"); }
          }
        })();
      </script>
